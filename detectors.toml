[[detectors]]
name = "SupabaseServiceRoleKeyDetector"
# Any HS256 Supabase JWT whose payload segment carries the base64url
# `service_role` claim (`c2VydmljZV9yb2xl`). The previous pattern embedded
# one fixture's exact payload and timestamps.
pattern = "\\beyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\\.[A-Za-z0-9_+/=-]*c2VydmljZV9yb2xl[A-Za-z0-9_+/=-]*\\.[A-Za-z0-9_+/=-]+\\b"
finding_type = "Supabase Service Role Key"
severity = "HIGH"
keywords = ["supabase", "service_role"]

